<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 350" width="1010" height="350" role="img" aria-label="How a tempergraph run flows: good outcome, step, checks, judge, outcome gate, done; failed checks and judge revisions loop back to the step; unsure verdicts pause for a person; every run feeds the self-improvement loop"><style>.t{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}.s{font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9198a1}.l{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9198a1}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker></defs><rect x="20" y="130" width="150" height="56" rx="10" fill="#161b22" stroke="#E3B04B" stroke-width="2"/><rect x="20" y="140" width="4" height="36" rx="2" fill="#E3B04B"/><text x="95.0" y="154" text-anchor="middle" class="t">Good outcome</text><text x="95.0" y="172" text-anchor="middle" class="s">criteria, verifiers</text><rect x="210" y="130" width="130" height="56" rx="10" fill="#161b22" stroke="#7D8EA0" stroke-width="2"/><rect x="210" y="140" width="4" height="36" rx="2" fill="#7D8EA0"/><text x="275.0" y="154" text-anchor="middle" class="t">Step</text><text x="275.0" y="172" text-anchor="middle" class="s">script or model</text><rect x="380" y="130" width="130" height="56" rx="10" fill="#161b22" stroke="#C9773A" stroke-width="2"/><rect x="380" y="140" width="4" height="36" rx="2" fill="#C9773A"/><text x="445.0" y="154" text-anchor="middle" class="t">Checks</text><text x="445.0" y="172" text-anchor="middle" class="s">deterministic</text><rect x="550" y="130" width="130" height="56" rx="10" fill="#161b22" stroke="#8A5CB0" stroke-width="2"/><rect x="550" y="140" width="4" height="36" rx="2" fill="#8A5CB0"/><text x="615.0" y="154" text-anchor="middle" class="t">Judge</text><text x="615.0" y="172" text-anchor="middle" class="s">independent</text><rect x="720" y="130" width="150" height="56" rx="10" fill="#161b22" stroke="#4A7FC1" stroke-width="2"/><rect x="720" y="140" width="4" height="36" rx="2" fill="#4A7FC1"/><text x="795.0" y="154" text-anchor="middle" class="t">Outcome gate</text><text x="795.0" y="172" text-anchor="middle" class="s">final criteria</text><rect x="910" y="130" width="80" height="56" rx="10" fill="#161b22" stroke="#4A7FC1" stroke-width="2"/><rect x="910" y="140" width="4" height="36" rx="2" fill="#4A7FC1"/><text x="950.0" y="163" text-anchor="middle" class="t">Done</text><text x="950.0" y="172" text-anchor="middle" class="s"></text><rect x="535" y="250" width="170" height="56" rx="10" fill="#161b22" stroke="#E5602D" stroke-width="2"/><rect x="535" y="260" width="4" height="36" rx="2" fill="#E5602D"/><text x="620.0" y="274" text-anchor="middle" class="t">Person decides</text><text x="620.0" y="292" text-anchor="middle" class="s">proceed · retry · back</text><rect x="715" y="250" width="180" height="56" rx="10" fill="#161b22" stroke="#7D8EA0" stroke-width="2" stroke-dasharray="6 5"/><rect x="715" y="260" width="4" height="36" rx="2" fill="#7D8EA0"/><text x="805.0" y="274" text-anchor="middle" class="t">Self-improvement</text><text x="805.0" y="292" text-anchor="middle" class="s">issues · proposals · trials</text><path d="M170 158.0 H206" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><path d="M340 158.0 H376" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><path d="M510 158.0 H546" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="528" y="150.0" text-anchor="middle" class="l">pass</text><path d="M680 158.0 H716" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="698" y="150.0" text-anchor="middle" class="l">pass</text><path d="M870 158.0 H906" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="888" y="150.0" text-anchor="middle" class="l">met</text><path d="M445 130 C445 92, 300 92, 300 126" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="372" y="92" text-anchor="middle" class="l">fail: retry</text><path d="M615 130 C615 34, 260 34, 260 126" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="438" y="44" text-anchor="middle" class="l">revise: retry with the judge's findings</text><path d="M615 186 V246" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="623" y="222" text-anchor="start" class="l">unsure or approval</text><path d="M535 278 H275 V190" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="412" y="270" text-anchor="middle" class="l">retry or back to a step</text><path d="M805 186 V246" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="813" y="222" text-anchor="start" class="l">every run's record</text><path d="M805 306 V332 H240 V190" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="518" y="326" text-anchor="middle" class="l">measured change, accepted by a person</text></svg>
