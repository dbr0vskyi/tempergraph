<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 500" width="1110" height="500" role="img" aria-label="How a tempergraph run flows: good outcome, then per step: step, deterministic checks, independent judge and gate, then the outcome gate and done. The gate retries the step, sends the run back or moves to the next step; it pauses for a person when the judge cannot verify, the step is blocked, a budget is spent or approval is needed. The person proceeds, retries, goes back, rewinds or stops. Every finished run feeds the self-improvement loop."><style>.t{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}.s{font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9198a1}.l{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9198a1}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker></defs><rect x="16" y="150" width="130" height="56" rx="10" fill="#161b22" stroke="#E3B04B" stroke-width="2"/><rect x="16" y="160" width="4" height="36" rx="2" fill="#E3B04B"/><text x="81.0" y="174" text-anchor="middle" class="t">Good outcome</text><text x="81.0" y="192" text-anchor="middle" class="s">criteria, verifiers</text><rect x="186" y="150" width="112" height="56" rx="10" fill="#161b22" stroke="#7D8EA0" stroke-width="2"/><rect x="186" y="160" width="4" height="36" rx="2" fill="#7D8EA0"/><text x="242.0" y="174" text-anchor="middle" class="t">Step</text><text x="242.0" y="192" text-anchor="middle" class="s">script or model</text><rect x="342" y="150" width="112" height="56" rx="10" fill="#161b22" stroke="#C9773A" stroke-width="2"/><rect x="342" y="160" width="4" height="36" rx="2" fill="#C9773A"/><text x="398.0" y="174" text-anchor="middle" class="t">Checks</text><text x="398.0" y="192" text-anchor="middle" class="s">deterministic</text><rect x="498" y="150" width="112" height="56" rx="10" fill="#161b22" stroke="#8A5CB0" stroke-width="2"/><rect x="498" y="160" width="4" height="36" rx="2" fill="#8A5CB0"/><text x="554.0" y="174" text-anchor="middle" class="t">Judge</text><text x="554.0" y="192" text-anchor="middle" class="s">independent</text><rect x="660" y="150" width="120" height="56" rx="10" fill="#161b22" stroke="#4A7FC1" stroke-width="2"/><rect x="660" y="160" width="4" height="36" rx="2" fill="#4A7FC1"/><text x="720.0" y="174" text-anchor="middle" class="t">Gate</text><text x="720.0" y="192" text-anchor="middle" class="s">budgets, routes</text><rect x="836" y="150" width="140" height="56" rx="10" fill="#161b22" stroke="#4A7FC1" stroke-width="2"/><rect x="836" y="160" width="4" height="36" rx="2" fill="#4A7FC1"/><text x="906.0" y="174" text-anchor="middle" class="t">Outcome gate</text><text x="906.0" y="192" text-anchor="middle" class="s">final criteria</text><rect x="1020" y="150" width="74" height="56" rx="10" fill="#161b22" stroke="#4A7FC1" stroke-width="2"/><rect x="1020" y="160" width="4" height="36" rx="2" fill="#4A7FC1"/><text x="1057.0" y="183" text-anchor="middle" class="t">Done</text><rect x="560" y="340" width="230" height="56" rx="10" fill="#161b22" stroke="#E5602D" stroke-width="2"/><rect x="560" y="350" width="4" height="36" rx="2" fill="#E5602D"/><text x="675.0" y="364" text-anchor="middle" class="t">Person decides</text><text x="675.0" y="382" text-anchor="middle" class="s">proceed · retry · back · rewind · stop</text><rect x="820" y="430" width="230" height="56" rx="10" fill="#161b22" stroke="#7D8EA0" stroke-width="2" stroke-dasharray="6 5"/><rect x="820" y="440" width="4" height="36" rx="2" fill="#7D8EA0"/><text x="935.0" y="454" text-anchor="middle" class="t">Self-improvement</text><text x="935.0" y="472" text-anchor="middle" class="s">issues · proposals · trials</text><path d="M146 178.0 H182" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><path d="M298 178.0 H338" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><path d="M454 178.0 H494" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="476.0" y="170.0" text-anchor="middle" class="l">pass</text><path d="M610 178.0 H656" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="635.0" y="170.0" text-anchor="middle" class="l">verdict</text><path d="M780 178.0 H832" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="808.0" y="170.0" text-anchor="middle" class="l">pass</text><path d="M976 178.0 H1016" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="998.0" y="170.0" text-anchor="middle" class="l">met</text><path d="M398.0 206 C398.0 252, 682 252, 682 210" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="540.0" y="258" text-anchor="middle" class="l">fail: no judge call</text><path d="M690.0 150 C690.0 106, 262 106, 262 146" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="476.0" y="110" text-anchor="middle" class="l">retry with the findings, or back to an earlier step (budget left)</text><path d="M730.0 150 C730.0 46, 236 46, 236 146" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="483.0" y="65" text-anchor="middle" class="l">pass: next step</text><path d="M906.0 150 C906.0 -20, 210 -20, 210 146" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="558.0" y="17" text-anchor="middle" class="l">unmet: back to the step that serves the criterion</text><path d="M720.0 206 V336" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="712.0" y="280" text-anchor="end" class="l">judge can't verify, blocked,</text><text x="712.0" y="296" text-anchor="end" class="l">budget spent, or approval:</text><text x="712.0" y="312" text-anchor="end" class="l">run pauses, exit 3</text><path d="M946.0 206 V368.0 H794" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="954.0" y="280" text-anchor="start" class="l">sign-off, or</text><text x="954.0" y="296" text-anchor="start" class="l">unmet twice</text><path d="M560 368.0 H262 V210" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="411.0" y="360.0" text-anchor="middle" class="l">retry · back · rewind (with feedback)</text><path d="M750 340 C750 266, 866.0 266, 866.0 210" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#a)"/><text x="762" y="332" text-anchor="start" class="l">proceed: go on as passed</text><text x="675.0" y="414" text-anchor="middle" class="l">stop ends the run (exit 4)</text><path d="M1057.0 206 V426" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="1049.0" y="380" text-anchor="end" class="l">every finished</text><text x="1049.0" y="396" text-anchor="end" class="l">run's record</text><path d="M820 458.0 H210 V210" fill="none" stroke="#6e7681" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="515.0" y="450.0" text-anchor="middle" class="l">measured change, merged by a person</text></svg>
