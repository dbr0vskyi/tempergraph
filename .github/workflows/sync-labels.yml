# Applies .github/labels.yml (names, colours, descriptions) to this repository's labels.
# Runs when the file changes on main, and by hand from the Actions tab.
name: Sync labels
on:
  push:
    branches: [main]
    paths: [".github/labels.yml", ".github/sync-labels.sh"]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: python3 -m pip install --quiet pyyaml
      - run: .github/sync-labels.sh "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
